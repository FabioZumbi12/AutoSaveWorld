name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoSaveWorld-jar
          path: target/*.jar

      - name: Generate release notes and checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH=$(ls -1 target/*.jar | head -n 1)
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"
          md5sum "$JAR_PATH" > target/MD5SUMS.txt

          TAG_NAME="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG_NAME}" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi

          {
            echo "## Alterações"
            git log --no-merges --pretty="- %s (%h)" $RANGE
            echo
            echo "## MD5"
            cat target/MD5SUMS.txt
          } > target/RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: target/RELEASE_NOTES.md
          files: |
            ${{ env.JAR_PATH }}
            target/MD5SUMS.txt
