# This workflow runs when a new tag starting with 'v' is pushed.
# It builds the plugin with the tag version, creates a GitHub Release, and uploads the final JAR.
#  For buils on github, push tags:
#  - git tag v1.0.0
#  - git push origin --tags
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set plugin.yml version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${VERSION}/" src/main/resources/plugin.yml

      - name: Build with Maven
        run: mvn -B clean install

      - name: Rename jar with build number
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH=$(ls -1 target/*.jar | head -n 1)
          NEW_JAR_PATH="target/AutoSaveWorld-b${GITHUB_RUN_NUMBER}.jar"
          mv "$JAR_PATH" "$NEW_JAR_PATH"
          echo "JAR_PATH=$NEW_JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoSaveWorld-jar
          path: ${{ env.JAR_PATH }}

      - name: Generate release notes and checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          md5sum "$JAR_PATH" > target/MD5SUMS.txt

          TAG_NAME="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG_NAME}" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi

          {
            echo "## Alterações"
            git log --no-merges --pretty="- %s (%h)" $RANGE
            echo
            echo "## MD5"
            echo '```'
            cat target/MD5SUMS.txt
            echo '```'
          } > target/RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoSaveWorld build ${{ github.run_number }} - ${{ github.ref_name }}"
          body_path: target/RELEASE_NOTES.md
          files: |
            ${{ env.JAR_PATH }}
            target/MD5SUMS.txt
